version: "3.9"

services:
  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: chikn_tndr_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chikn_tndr
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chikn_tndr"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── API server (optional — run locally with `npm run dev` instead) ─────────
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: chikn_tndr_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ./server/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/chikn_tndr?schema=public
    ports:
      - "4000:4000"
    profiles:
      - full # only start with: docker compose --profile full up
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Client (optional) ──────────────────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: chikn_tndr_client
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"
    profiles:
      - full

volumes:
  postgres_data:
